# Weave review-loop hook. Adopt this workflow together with
# .github/scripts/review_loop.py and .github/scripts/merge_digest.py, and set
# HIVE_BOT_TOKEN plus CODEX_REVIEW_PAT.
#
# LOGFIRE_TOKEN is optional. With it, every belt decision is exported as a
# Logfire span (KRA-1132) and belt convergence — rounds to CLEAN, findings per
# round, which PRs reach the bound — is a query instead of thread archaeology.
# Without it the helper behaves exactly as it did before: telemetry is
# collected, exported nowhere, and never gates a wake.
#
# This workflow ROUTES Codex verdicts. It runs no tests and asserts nothing
# about the code. Its own success is not evidence that a head is good — a PR
# whose only green check came from here was misread as tested during the
# 2026-08-15 merge sweep (KRA-1082). Every job below says so in its display
# name, so the checks list cannot repeat that misread.
name: review-loop

on:
  pull_request:
    types: [closed]
  # A head move summons its own review round (summon-on-push below). It is a
  # pull_request_TARGET event on purpose: a plain `pull_request` run executes
  # the PR's own revision of this file, so a same-repository PR could rewrite
  # a step to read CODEX_REVIEW_PAT or HIVE_BOT_TOKEN. pull_request_target runs
  # the default branch's revision with the PR only as data; every step below
  # still checks out the default branch and never executes PR-controlled code.
  pull_request_target:
    types: [synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      canary:
        description: "Also post the burn-seat liveness canary"
        default: "no"
        type: choice
        options: ["no", "yes"]

# The group is the pair a run actually writes to: (event family, subject).
#
# A concurrency group holds ONE running plus ONE pending run. Queuing a third
# cancels the pending one, and `cancel-in-progress: false` does not change that
# — it protects the run that is executing, never the one that is waiting. Under
# the previous constant group `weave-review-loop`, every event in the repository
# shared that single pending slot, so a chatty burn on one PR silently cancelled
# another PR's queued verdict routing. Measured on Skrates/sokrates over the 300
# review-loop runs to 2026-09-04T21:10Z: 47 cancelled, 20 of them
# `pull_request_review` and 2 `pull_request`. A dropped verdict is a wake nobody
# receives; nothing records that a round happened and the burn seat is the only
# witness. Serialising to avoid a duplicate wake (harmless — deduped downstream)
# at the cost of a dropped wake (a silent stall) is the asymmetry the wrong way
# round.
#
# Keying on the PR alone is not enough. Measured 2026-09-02 on this repository's
# own #138: the landing comment posted right after the squash merge evicted that
# same PR's pending `pull_request: closed` run, which completed `cancelled` with
# an EMPTY jobs array — the merge digest was never published and no terminal
# belt span was emitted. So the key carries the event family as well: for any
# one event exactly one family of jobs below can fire. Verdict and closure
# write disjoint GitHub state. Sweep and verdict-<pr> both publish wakes
# for the same PR: the previous constant group serialised them, so dropping
# that without a write guard lets the scan post a stale snapshot after the
# event route has already published a newer verdict. Every sweep-side
# publication — nudge, substitute summon, exhaustion gate, wake redelivery —
# therefore passes `verdict_state_held`, which re-fetches the head's verdict
# immediately before publication and refuses unless the snapshot it was
# computed from is still the latest at the head — compared by GitHub's own
# record id, not by its whole-second timestamp (KRA-1368).
#
#   verdict-<pr>   pull_request_review, issue_comment -> wake-on-codex-result
#   push-<pr>      pull_request_target (synchronize)  -> summon-on-push
#   closure-<pr>   pull_request (closed)              -> announce-machine-merge,
#                                                        belt-terminal
#   sweep          schedule, workflow_dispatch        -> nudge, terminal-sweep,
#                                                        review-loop-canary
#
# Same family and same PR still serialise, because that is the only place the
# helper's check-then-post marker idempotency actually races. Losing a pending
# `sweep` run is safe by construction and not by luck: the scheduled leg
# re-enumerates every open PR from GitHub state, so the next run does the
# evicted run's work — "next" being whenever GitHub honours the schedule,
# which under load is hours, not five minutes (see summon-on-push). That same
# enumeration (`review_loop._scan_open_pull` -> `redeliver_standing_wake`) is
# the belt's reconciliation leg for a verdict whose routing was dropped — it
# re-derives the standing verdict from the reviews and comments at the head
# rather than from event delivery. It is deliberately the only such leg
# (KRA-1325). Losing a pending `push-<pr>` run is safe for the same reason
# a lost sweep is: a third push evicts the second's pending run, the third
# run summons at the latest head, and `refresh_pr_at_head` refuses to post
# for a head that has already moved on. Push and sweep can both reach one PR;
# the marker race there is the sweep-vs-verdict one, and its worst case is a
# duplicate summon at the same head — attention-only, no round, because
# rounds count distinct reviewed heads.
concurrency:
  group: >-
    weave-review-loop-${{
    (github.event_name == 'pull_request_review' || github.event_name == 'issue_comment')
    && format('verdict-{0}', github.event.issue.number || github.event.pull_request.number)
    || github.event_name == 'pull_request_target'
    && format('push-{0}', github.event.pull_request.number)
    || github.event_name == 'pull_request'
    && format('closure-{0}', github.event.pull_request.number)
    || 'sweep' }}
  cancel-in-progress: false

env:
  HIVE_CHANNEL: C0BGBEQQQHH
  CODEX_LOGIN: chatgpt-codex-connector[bot]
  CODEX_REVIEW_AUTHOR: RationallyPrime
  # Reviewer-router meter (all optional; absent => pre-router behavior, Codex
  # always). URL/pool/threshold are repository variables, the read token a
  # secret. The meter is advisory: any failure routes to Codex as before.
  AI_USAGE_URL: ${{ vars.AI_USAGE_URL }}
  AI_USAGE_CODEX_POOL: ${{ vars.AI_USAGE_CODEX_POOL }}
  AI_USAGE_CODEX_THRESHOLD: ${{ vars.AI_USAGE_CODEX_THRESHOLD }}
  REVIEW_SUBSTITUTE_ACTOR: ${{ vars.REVIEW_SUBSTITUTE_ACTOR }}
  REVIEW_BURN_ACTOR: ${{ vars.REVIEW_BURN_ACTOR }}
  # The burn cast is a roster the usage meter reads (2026-09-07): seats in
  # preference order, first available wins; unset => the single cast above.
  REVIEW_BURN_ROSTER: ${{ vars.REVIEW_BURN_ROSTER }}
  REVIEW_BURN_THRESHOLD: ${{ vars.REVIEW_BURN_THRESHOLD }}
  REVIEW_SEAT_USAGE_PROFILES: ${{ vars.REVIEW_SEAT_USAGE_PROFILES }}
  # Burn wakes carry the edge's `Effort:` overlay: PR label `effort:<tier>`
  # wins, else this repository default; unset => no overlay line.
  REVIEW_BURN_EFFORT: ${{ vars.REVIEW_BURN_EFFORT }}
  # The retrospective seat is a cast too; `none` holds the third hook
  # (Hákon's ruling, 2026-09-07). Unset => theoros.
  REVIEW_RETROSPECTIVE_ACTOR: ${{ vars.REVIEW_RETROSPECTIVE_ACTOR }}
  # Optional `Git Author Name=seat` overlay. Two home cases: a non-seat
  # author (the commits land under a human identity) and GitHub's
  # "Update branch" merge commit (HEAD is the clicker's git name, so the
  # seat gate would otherwise skip the PR in silence). Honoured only on
  # same-repo heads — see review_loop.author_aliases.
  REVIEW_AUTHOR_ALIASES: ${{ vars.REVIEW_AUTHOR_ALIASES }}
  # Optional comma-separated corpus roots that skip the review loop in THIS
  # repository, on top of the fixed skill roots (`skills/`, `.agents/skills/`,
  # `.claude/skills/`). Declare only corpora whose whole quality bar is a
  # mechanical CI gate — recipe YAML, law primitives (ruling 2026-09-03), e.g.
  # `nomos/corpus_source/,polis/src/polis/ergon/registry/recipes/`. A PR
  # touching only these paths gets no summon, burn, or exhaustion gate; a
  # mixed PR rides the loop. Read at workflow level on purpose: the scheduled
  # scan that summons, the verdict router and the terminal leg must all apply
  # one list. The weekly skill audit never sweeps these roots.
  REVIEW_LOOP_EXEMPT_PATHS: ${{ vars.REVIEW_LOOP_EXEMPT_PATHS }}

permissions:
  contents: read
  pull-requests: write
  checks: read
  # The terminal legs date a declared REVIEW_LOOP_EXEMPT_PATHS against the
  # variable's updated_at, so a closure that predates the declaration is not
  # filed as exempt. Reading a repository variable needs this.
  actions: read

jobs:
  wake-on-codex-result:
    name: Route Codex verdict to Hive (routing only — not a test gate)
    # The third arm fires on a substitute reviewer's verdict comment. The
    # author literal mirrors CODEX_REVIEW_AUTHOR (env context is unavailable
    # in job-level if); the helper re-verifies trust server-side either way,
    # so this filter is cost control, not the trust boundary.
    if: >-
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'RationallyPrime' && contains(github.event.comment.body, 'weave-review-loop:substitute-verdict:'))
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","cx53"]' || '["ubuntu-latest"]') }}
    steps:
      # The helper executes with a Slack credential. Always load it from the
      # trusted default branch, never from the reviewed PR head.
      - name: Checkout trusted review-loop helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Route Codex verdict to Hive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIVE_BOT_TOKEN: ${{ secrets.HIVE_BOT_TOKEN }}
          # The burn cast reads the usage meter; absent => the static cast.
          AI_USAGE_READ_TOKEN: ${{ secrets.AI_USAGE_READ_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: python3 .github/scripts/review_loop.py route

  review-loop-canary:
    name: Hive canary (routing only — not a test gate)
    if: github.event_name == 'workflow_dispatch' && inputs.canary == 'yes'
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","cx53"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout trusted review-loop helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Wake Talos with a read-only canary
        env:
          HIVE_BOT_TOKEN: ${{ secrets.HIVE_BOT_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: python3 .github/scripts/review_loop.py canary

  summon-on-push:
    name: Summon a reviewer at the moved head (routing only — not a test gate)
    # The event twin of nudge-stalled-reviews. A repaired head needs its own
    # round, and the scheduled scan is not a five-minute clock: GitHub delivers
    # `*/5` as a multi-hour heartbeat under load (five firings in the fourteen
    # hours to 2026-09-06T13:34Z on Skrates/sokrates), so a burn's next round
    # waited for the clock, not for the push. This fires on the push. It posts
    # through the same one summon site as the scan (`_scan_open_pull`), so the
    # seat gate, exemption, round bound, hold and once-per-head coverage are
    # identical; only the commit-age stall window is waived, because the head
    # move is the evidence that window exists to wait for.
    #
    # pull_request_target, never pull_request: this job holds the summon PAT,
    # and a pull_request run would execute the PR's own revision of this file
    # (see the trigger block). Same-repository heads only, as cost control —
    # the seat gate inside the helper skips a fork head regardless, and a
    # fork burn keeps the hand summon (adopt-review-loop behaviour notes).
    # Dependabot is excluded outright: its heads are never seat-authored, so
    # the run would only ever pay for a client to skip them.
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","cx53"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout trusted review-loop helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Connected-account @codex review at the new head
        env:
          # Codex refuses summons authored by github-actions[bot]; same PAT as
          # the scheduled nudge, same identity check inside the helper.
          GITHUB_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          # The meter may route this head to a substitute seat over Hive.
          HIVE_BOT_TOKEN: ${{ secrets.HIVE_BOT_TOKEN }}
          AI_USAGE_READ_TOKEN: ${{ secrets.AI_USAGE_READ_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: python3 .github/scripts/review_loop.py push

  nudge-stalled-reviews:
    name: Nudge stalled reviews (routing only — not a test gate)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","cx53"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout trusted review-loop helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Connected-account @codex review on stalled agent PRs
        env:
          # Codex refuses summons authored by github-actions[bot]. This narrowly
          # scoped PAT belongs to the GitHub user connected to Codex cloud.
          GITHUB_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          # The scheduled leg also re-delivers standing verdicts, so it needs a
          # Slack credential. Without it this job cannot reach Hive at all.
          HIVE_BOT_TOKEN: ${{ secrets.HIVE_BOT_TOKEN }}
          # Optional reviewer-router meter credential; absent => Codex always.
          AI_USAGE_READ_TOKEN: ${{ secrets.AI_USAGE_READ_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: python3 .github/scripts/review_loop.py nudge

  announce-machine-merge:
    name: Announce machine merge (routing only — not a test gate)
    # The per-merge half of the machine-merge digest (KRA-1083). Under the
    # retrospective-veto regime the composed boundary admits the merge, so this
    # is where Hákon learns what landed — one substance line, at merge time.
    #
    # A merged fork PR carries no secrets on this event and so cannot be
    # announced here; the scheduled cross-repo digest reads it with its own
    # token, and is the completeness backstop for exactly that case.
    # Same-repository heads only: a fork `pull_request` run has empty
    # secrets, so `merge_digest.py announce` would red on required_env
    # instead of deferring to that backstop.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","cx53"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout trusted digest helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Announce the machine merge to Hive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIVE_BOT_TOKEN: ${{ secrets.HIVE_BOT_TOKEN }}
        run: python3 .github/scripts/merge_digest.py announce

  belt-terminal:
    name: Record the belt outcome (telemetry only — not a test gate)
    # Every close, not only a merge: a PR abandoned after five rounds is the
    # convergence signal a merged-only view cannot see. Wakes nobody and posts
    # nothing; with no LOGFIRE_TOKEN it is a no-op that still exits green.
    #
    # A fork-originated PR carries no secrets on this event, so its closure
    # cannot be exported here — the same limitation announce-machine-merge
    # declares above. belt-terminal-sweep is the completeness backstop for
    # exactly that case, and the span is keyed on the closure, so the two
    # paths cannot double-count a PR between them.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","cx53"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout trusted review-loop helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Emit the terminal belt span
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: python3 .github/scripts/review_loop.py terminal

  belt-terminal-sweep:
    name: Backfill fork closures into the belt (telemetry only — not a test gate)
    # The completeness backstop belt-terminal names. A fork PR's closure event
    # holds no secrets, so that job exports nothing and the closure is missing
    # from the live convergence distribution — indistinguishable from a PR that
    # never closed. This runs on the schedule, in the base repository's own
    # context, where LOGFIRE_TOKEN exists, and re-emits recent fork closures.
    #
    # Overlapping the closure event is harmless and deliberate: the span
    # carries the closure's own id, not the export's, and every dashboard query
    # groups on it. Detecting which closures already exported would need a
    # second store to be right; the dedup already is.
    if: github.event_name == 'schedule'
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","cx53"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout trusted review-loop helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Emit terminal spans for fork closures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: python3 .github/scripts/review_loop.py terminal-sweep
